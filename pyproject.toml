[project]
name = "gcbml"
version = "0.1.0"
description = "Grid-Convergent Bayesian ML: multi-fidelity GP learning of the converged (h -> 0) answer with budget-aware sequential design"
readme = "README.md"
authors = [
    { name = "Elvis Aguero", email = "elvisavfc65@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "blackjax>=1.7.1",
    "jax>=0.7",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "arviz>=1.3.0",
    "matplotlib>=3.8",
    "hypothesis>=6.168.3",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]
# Baseline (b) of benchmarks/PROTOCOL.md: Yi et al.'s own code. mfbml declares no dependencies, so the ones its
# imports need are listed here. Its KRR-LR-GPR fails under numpy >= 2 (it pins numpy 1.26.4): see benchmarks/README.md.
bench = [
    "mfbml @ git+https://github.com/JiaxiangYi96/mfbml.git",
    "mfpml @ git+https://github.com/JiaxiangYi96/mfpml.git",
    "scikit-learn",
    "torch",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow' -n auto"
markers = ["slow: long statistical or benchmark test; run on a compute node with `-m slow`"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["B905"]
